[project]
name = "cloud-autoscaling-using-rl"
version = "1.0.0"
description = "Reinforcement learning approach to cloud auto-scaling comparing tabular RL, deep RL, and policy gradient methods"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Srivatsa Balasubramanyam"},
    {name = "Ryan Healy"},
    {name = "Bruce McGregor"},
]
keywords = ["reinforcement-learning", "cloud-computing", "auto-scaling", "DQN", "SARSA", "Q-Learning", "REINFORCE"]
dependencies = [
    "gymnasium>=1.2.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "pre-commit>=3.6.0",
    "ruff>=0.14.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "git-lfs>=1.6",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.7.0",
    "wandb>=0.23.1",
    "optuna>=4.6.0",
    "optuna-integration>=4.6.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
